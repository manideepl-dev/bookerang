plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.4.1"
}

group = 'dev.manideeplanka'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("io.javalin:javalin:7.2.2")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.21.2")
    implementation("org.postgresql:postgresql:42.7.2")
    implementation("com.zaxxer:HikariCP:5.1.0")
    implementation("org.jdbi:jdbi3-core:3.45.0")
    implementation("org.jdbi:jdbi3-sqlobject:3.45.0")
    implementation("org.mindrot:jbcrypt:0.4")
    implementation("org.projectlombok:lombok:1.18.44")
    annotationProcessor("org.projectlombok:lombok:1.18.44")
    implementation("com.auth0:java-jwt:4.4.0")
    implementation("io.github.cdimascio:dotenv-java:3.2.0")
    implementation 'ch.qos.logback:logback-classic:1.5.34'
    implementation 'org.flywaydb:flyway-core:11.15.0'
    implementation 'org.flywaydb:flyway-database-postgresql:11.15.0'
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    manifest {
        attributes 'Main-Class': 'dev.manideeplanka.bookerang.BookerangApp'
    }
}