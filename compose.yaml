services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bookerang
      POSTGRES_USER: bookerang
      POSTGRES_PASSWORD: ${BOOKERANG_DB_PASSWORD:?Set BOOKERANG_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bookerang-data:/var/lib/postgresql/data
volumes:
  bookerang-data:
